<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Escáner de multas</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* Cámara a pantalla completa; marco que se ajusta a la hoja; hoja inferior de cristal con los tres pasos */
  :root {
    --glass: rgba(28, 28, 30, .72);
    --glass-2: rgba(118, 118, 128, .24);
    --fg: #ffffff;
    --muted: rgba(235, 235, 245, .62);
    --hair: rgba(84, 84, 88, .55);
    --blue: #0a84ff;
    --green: #30d158;
    --amber: #ffd60a;
    --red: #ff453a;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --spring: cubic-bezier(.2, .9, .25, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--fg); font: 16px/1.35 var(--font); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, a { font: inherit; color: inherit; }

  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Marco: se mueve y cambia de tamaño hasta abrazar la hoja */
  #box {
    position: absolute; left: 0; top: 0; width: 100px; height: 100px; border-radius: 22px;
    box-shadow: 0 0 0 200vmax rgba(0, 0, 0, .42);
    transition: transform .38s var(--spring), width .38s var(--spring), height .38s var(--spring), opacity .3s;
    pointer-events: none; overflow: hidden; will-change: transform, width, height;
  }
  #box i { position: absolute; width: 30px; height: 30px; border: 3.5px solid #fff; transition: border-color .25s, width .3s var(--spring), height .3s var(--spring); }
  #box i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 22px; }
  #box i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 22px; }
  #box i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 22px; }
  #box i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 22px; }
  #box.locked i { border-color: var(--green); width: 42px; height: 42px; }
  #beam {
    position: absolute; left: 0; right: 0; top: 0; height: 38%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.16) 85%, rgba(255,255,255,.75));
    animation: beam 1.9s cubic-bezier(.45, 0, .55, 1) infinite;
  }
  #box.locked #beam { background: linear-gradient(to bottom, rgba(48,209,88,0), rgba(48,209,88,.16) 85%, rgba(48,209,88,.8)); }
  #box.done #beam { display: none; }
  @keyframes beam { from { transform: translateY(-100%); } to { transform: translateY(265%); } }
  @media (prefers-reduced-motion: reduce) { #beam { animation: none; display: none; } #box { transition: none; } }

  .glass { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); }

  #top {
    position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  #hint { padding: 9px 15px; border-radius: 999px; font-size: .9rem; font-weight: 600; max-width: 100%; }
  #torch { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; }
  #torch svg { width: 22px; height: 22px; }
  #torch[aria-pressed="true"] { background: var(--amber); color: #1c1c1e; }

  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px 26px 0 0;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 12px; max-height: 78%; overflow-y: auto;
  }
  #sheet { transition: padding .25s; touch-action: pan-x; }
  #grab { align-self: stretch; height: 26px; margin: -6px 0 -8px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
  #grab::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: rgba(235, 235, 245, .4); }
  .short { display: none; font-size: .82rem; font-weight: 600; }
  /* Minimizada: una sola fila con los tres pasos */
  #sheet.mini { gap: 6px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  #sheet.mini .list { display: flex; }
  #sheet.mini .item { flex: 1 1 0; min-height: 44px; padding: 8px 10px; gap: 8px; min-width: 0; }
  #sheet.mini .item + .item { border-top: 0; border-left: .5px solid var(--hair); }
  #sheet.mini .txt { display: none; }
  #sheet.mini .short { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sheet.mini .dot { width: 20px; height: 20px; }
  #sheet.mini .dot svg { width: 11px; height: 11px; }
  #sheet.mini .actions:has(#start[hidden]) { display: none; }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
  #resultView { display: flex; flex-direction: column; gap: 12px; }

  .list { border-radius: 16px; background: var(--glass-2); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 14px; min-height: 56px; }
  .item + .item { border-top: .5px solid var(--hair); }
  .dot { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--hair); transition: background .25s, border-color .25s; }
  .dot svg { width: 14px; height: 14px; opacity: 0; transition: opacity .2s; }
  .item.busy .dot { border-color: var(--blue); border-right-color: transparent; animation: spin .8s linear infinite; }
  .item.ok .dot { background: var(--green); border-color: var(--green); color: #04210d; }
  .item.ok .dot svg { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .lbl { font-size: .78rem; color: var(--muted); }
  .val { font-size: 1.02rem; font-weight: 600; overflow-wrap: anywhere; }
  .val.mono, input.val { font-family: var(--mono); letter-spacing: .03em; }
  input.val { width: 100%; border: 0; outline: 0; background: transparent; color: var(--fg); padding: 0; font-size: 1.12rem; font-weight: 700; border-radius: 0; }
  input.val::placeholder { color: var(--muted); font-weight: 500; font-family: var(--font); letter-spacing: 0; font-size: .95rem; }

  .pill { flex: none; min-width: 74px; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--glass-2); color: var(--blue); font-weight: 600; font-size: .95rem; }
  .pill.done { color: var(--green); }

  #verdict { border-radius: 16px; padding: 13px 14px; display: flex; gap: 12px; align-items: flex-start; background: var(--glass-2); }
  #verdict svg { flex: none; width: 28px; height: 28px; margin-top: 1px; }
  #verdict b { display: block; font-size: 1rem; }
  #verdict p { margin: 3px 0 0; font-size: .86rem; font-family: var(--mono); overflow-wrap: anywhere; }
  #verdict ul { margin: 6px 0 0; padding-left: 18px; font-size: .86rem; color: var(--muted); }
  #verdict.safe { background: rgba(48, 209, 88, .16); } #verdict.safe svg, #verdict.safe b { color: var(--green); }
  #verdict.warn { background: rgba(255, 214, 10, .14); } #verdict.warn svg, #verdict.warn b { color: var(--amber); }
  #verdict.bad { background: rgba(255, 69, 58, .18); } #verdict.bad svg, #verdict.bad b { color: var(--red); }

  .actions { display: flex; gap: 10px; }
  .btn { flex: 1 1 0; min-height: 52px; border-radius: 15px; border: 0; padding: 0 14px; font-weight: 600; font-size: 1.02rem; display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; background: var(--glass-2); color: var(--fg); }
  .btn.primary { background: var(--blue); color: #fff; flex: 1.6 1 0; }
  .btn.danger { background: var(--red); }
  .btn:active, .pill:active, #torch:active { opacity: .7; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  #issuer { margin: -4px 0 0; font-size: .95rem; color: var(--muted); }
  #issuer b { color: var(--fg); }
  .actions.col { flex-direction: column; }
  .actions.col .btn { flex: none; width: 100%; }
  .more { display: block; text-align: center; font-size: .86rem; color: var(--blue); text-decoration: none; padding: 2px 0; }
  .foot { margin: 0; font-size: .78rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="box"><i></i><i></i><i></i><i></i><div id="beam"></div></div>

  <div id="top">
    <div id="hint" class="glass" aria-live="polite">Abriendo la cámara…</div>
    <button id="torch" class="glass" hidden aria-pressed="false" aria-label="Flash">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
    </button>
  </div>

  <div id="sheet" class="glass">
    <button id="grab" aria-label="Minimizar o ampliar el panel" aria-expanded="true"></button>
    <!-- Mientras escanea: los tres pasos, en orden -->
    <div id="scanView">
      <div class="list">
        <div class="item" id="stSite"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <span class="short">Sitio</span><span class="txt"><span class="lbl">1 · Sitio de pago</span><span class="val" id="vSite">Buscando el código QR…</span></span></div>
        <div class="item" id="stNum"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <span class="short">Citation</span><span class="txt"><span class="lbl">2 · Citation No.</span><span class="val mono" id="vNum">—</span></span></div>
        <div class="item" id="stTag"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <span class="short">Tag</span><span class="txt"><span class="lbl">3 · Vehicle Tag</span><span class="val mono" id="vTag">—</span></span></div>
      </div>
      <div class="actions" style="margin-top:12px">
        <button id="start" class="btn primary" hidden>Activar cámara</button>
      </div>
    </div>

    <!-- Resultado -->
    <div id="resultView" hidden>
      <h1 id="rTitle">Multa leída</h1>
      <p id="issuer" hidden></p>

      <div id="verdict" class="warn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3z"/></svg>
        <div><b id="vdTitle"></b><p id="vdHost"></p><ul id="vdWhy"></ul></div>
      </div>

      <div class="list">
        <div class="item"><span class="txt"><label class="lbl" for="fNum">Citation No.</label><input class="val" id="fNum" placeholder="No se pudo leer: escríbelo" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"></span>
          <button class="pill" id="cNum">Copiar</button></div>
        <div class="item"><span class="txt"><label class="lbl" for="fTag">Vehicle Tag</label><input class="val" id="fTag" placeholder="No se pudo leer: escríbelo" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"></span>
          <button class="pill" id="cTag">Copiar</button></div>
      </div>

      <div class="actions col">
        <a id="official" class="btn primary" target="_blank" rel="noopener noreferrer" hidden>Pagar en el sitio oficial</a>
        <a id="go" class="btn" target="_blank" rel="noopener noreferrer">Abrir enlace del QR</a>
        <button id="again" class="btn">Escanear otra</button>
      </div>
      <a id="others" class="more" target="_blank" rel="noopener noreferrer" hidden>Ver todos los resultados oficiales</a>
      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const video = $('video'), box = $('box'), sheet = $('sheet');
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const ocrCanvas = document.createElement('canvas'), octx = ocrCanvas.getContext('2d', { willReadFrequently: true });
  const FOOT = 'Una multa real nunca se paga con tarjetas de regalo, Zelle ni criptomonedas.';

  // ============ 1. Datos de la multa: solo «Citation No» y «Tag Number» ============
  const NUM_RE = /\bcitation[ \t]*(?:n[o0]|number|num|#)?[.:#\s-]*(?!citation)([A-Z0-9][A-Z0-9-]{4,17})\b/i;
  const TAG_RE = /\b(?:vehicle\s*tag\s*(?:number|num|#)?|tag\s*(?:number|num|#))[.:#\s-]*([A-Z0-9][A-Z0-9 .-]{2,13}[A-Z0-9])\b/i;
  const clean = { num: v => v.toUpperCase().replace(/\s+/g, ''), tag: v => {
    // En la casilla puede venir «NO» o la sigla del estado (VA, MD, DC…) antes de la placa: se quitan
    let t = v.toUpperCase().replace(/\s+/g, ' ').trim();
    t = t.replace(/^(?:NO|N0|NUM|NUMBER)\b[.:#]?\s*/, '').replace(/^#\s*/, '');
    const m = t.match(/^([A-Z]{2})\s+(.{2,})$/);
    if (m && STATES.includes(m[1]) && /\d/.test(m[2])) t = m[2];
    return t.replace(/\s+(?:AL|AK|AZ|AR|CA|CO|CT|DE|DC|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY)$/, '').trim();
  } };
  const STATES = 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split(' ');
  const fields = {
    num: { re: NUM_RE, votes: new Map(), value: '', zone: null, tries: 0 },
    tag: { re: TAG_RE, votes: new Map(), value: '', zone: null, tries: 0 }
  };
  const LABEL = { num: /\bcitation\b/i, tag: /\b(vehicle\s*tag|tag\s*(number|num|n[o0]|#))/i };
  function parse(kind, text) {
    // La palabra puede salir antes en un título («PARKING CITATION»): vale la primera que traiga cifras
    for (const m of text.matchAll(new RegExp(fields[kind].re.source, 'gi'))) {
      if ((m[1].match(/\d/g) || []).length >= (kind === 'num' ? 3 : 1)) return clean[kind](m[1]);
    }
    // Formato de tabla: la etiqueta está en una fila y el valor justo debajo, en la misma columna
    const lines = text.split('\n');
    for (let i = 0; i < lines.length - 1; i++) {
      const cols = lines[i].trim().split(/\s{2,}|\t|\|/), at = cols.findIndex(c => LABEL[kind].test(c));
      if (at < 0) continue;
      for (let j = i + 1; j <= i + 2 && j < lines.length; j++) {
        const v = (lines[j].trim().split(/\s{2,}|\t|\|/)[at] || '').trim();
        if (/^[A-Z0-9][A-Z0-9 .-]{2,17}$/i.test(v) && (v.match(/\d/g) || []).length >= (kind === 'num' ? 3 : 1)) return clean[kind](v);
      }
    }
    return '';
  }
  function vote(kind, v) {
    if (!v) return;
    const f = fields[kind];
    f.votes.set(v, (f.votes.get(v) || 0) + 1);
    f.value = [...f.votes].sort((a, b) => b[1] - a[1])[0][0];
  }
  const sure = kind => (fields[kind].votes.get(fields[kind].value) || 0) >= 2;

  // ============ 1b. ¿Quién emitió la multa? ============
  const STATE_NAMES = { ALABAMA:'AL', ALASKA:'AK', ARIZONA:'AZ', ARKANSAS:'AR', CALIFORNIA:'CA', COLORADO:'CO', CONNECTICUT:'CT', DELAWARE:'DE',
    'DISTRICT OF COLUMBIA':'DC', FLORIDA:'FL', GEORGIA:'GA', HAWAII:'HI', IDAHO:'ID', ILLINOIS:'IL', INDIANA:'IN', IOWA:'IA', KANSAS:'KS', KENTUCKY:'KY',
    LOUISIANA:'LA', MAINE:'ME', MARYLAND:'MD', MASSACHUSETTS:'MA', MICHIGAN:'MI', MINNESOTA:'MN', MISSISSIPPI:'MS', MISSOURI:'MO', MONTANA:'MT',
    NEBRASKA:'NE', NEVADA:'NV', 'NEW HAMPSHIRE':'NH', 'NEW JERSEY':'NJ', 'NEW MEXICO':'NM', 'NEW YORK':'NY', 'NORTH CAROLINA':'NC', 'NORTH DAKOTA':'ND',
    OHIO:'OH', OKLAHOMA:'OK', OREGON:'OR', PENNSYLVANIA:'PA', 'RHODE ISLAND':'RI', 'SOUTH CAROLINA':'SC', 'SOUTH DAKOTA':'SD', TENNESSEE:'TN', TEXAS:'TX',
    UTAH:'UT', VERMONT:'VT', VIRGINIA:'VA', WASHINGTON:'WA', 'WEST VIRGINIA':'WV', WISCONSIN:'WI', WYOMING:'WY' };
  const STOP = /\b(POLICE|PARKING|DEPARTMENT|DEPT|DIVISION|ENFORCEMENT|CITATION|TRAFFIC|NOTICE|VIOLATION|SUMMONS|UNIFORM|SERVICES|AUTHORITY|OFFICE|COURT|SHERIFF|PUBLIC|SAFETY|TRANSPORTATION|BUREAU|MUNICIPAL)\b.*$/;
  const title = w => w.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
  const issuer = { votes: new Map(), value: null };
  function parseIssuer(text) {
    const lines = text.toUpperCase().split('\n').map(l => l.replace(/[^A-Z0-9 ,.'&-]/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean).slice(0, 10);
    for (const line of lines) {
      let kind = '', name = '', m, after = false;
      if ((m = line.match(/\b(CITY|TOWN|VILLAGE|COUNTY|BOROUGH|TOWNSHIP|PARISH)\s+OF\s+(?:THE\s+)?([A-Z][A-Z .'-]{2,40})/))) { kind = m[1]; name = m[2]; }
      else if ((m = line.match(/\b(UNIVERSITY)\s+OF\s+([A-Z][A-Z .'-]{2,40})/))) { kind = 'UNIVERSITY'; name = m[2]; }
      else if ((m = line.match(/^(?:THE\s+)?([A-Z][A-Z .'-]{2,30}?)\s+(COUNTY|CITY|PARISH|UNIVERSITY)\b/)) && !/\b(PARKING|CITATION|NOTICE|VIOLATION)\b/.test(m[1])) { name = m[1]; kind = m[2]; after = true; }
      else if ((m = line.match(/^(?:THE\s+)?([A-Z][A-Z .'-]{2,30}?)\s+(POLICE|SHERIFF|PARKING AUTHORITY)\b/)) && !/\b(PARKING|CITATION|NOTICE|UNIFORM)\b/.test(m[1])) { name = m[1]; kind = m[2] === 'POLICE' ? 'POLICE' : m[2]; }
      if (!name) continue;
      name = name.split(',')[0].replace(STOP, '').trim().split(' ').slice(0, 3).join(' ');
      if (name.length < 3 || /^(OF|THE)$/.test(name)) continue;
      // estado: el nombre completo o la sigla tras una coma, en la cabecera (no el del coche)
      let st = '';
      const head = lines.join(' ');
      for (const [full, ab] of Object.entries(STATE_NAMES)) if (new RegExp('\\b(?:COMMONWEALTH|STATE) OF ' + full + '\\b|,\\s*' + full + '\\b|\\b' + full + '\\s*$').test(line) || new RegExp('\\b(?:COMMONWEALTH|STATE) OF ' + full + '\\b').test(head)) { st = ab; break; }
      if (!st) { const a = line.match(/,\s*([A-Z]{2})\b/); if (a && STATES.includes(a[1])) st = a[1]; }
      const nice = { CITY: 'City of ', TOWN: 'Town of ', VILLAGE: 'Village of ', COUNTY: '', BOROUGH: 'Borough of ', TOWNSHIP: 'Township of ', PARISH: '', UNIVERSITY: '', POLICE: '' }[kind] ?? '';
      const label = after ? title(name) + ' ' + title(kind)
                  : kind === 'COUNTY' || kind === 'PARISH' ? title(name) + ' ' + title(kind)
                  : kind === 'UNIVERSITY' ? (/OF/.test(line) ? 'University of ' + title(name) : title(name) + ' University')
                  : kind === 'POLICE' || kind === 'SHERIFF' || kind === 'PARKING AUTHORITY' ? title(name) : nice + title(name);
      return { name: title(name), label, state: st, edu: kind === 'UNIVERSITY', parking: /PARKING/.test(head) };
    }
    return null;
  }
  function voteIssuer(text) {
    const r = parseIssuer(text);
    if (!r) return;
    const key = r.label;
    const e = issuer.votes.get(key) || { n: 0, r };
    e.n++; if (!e.r.state && r.state) e.r = r;
    issuer.votes.set(key, e);
    issuer.value = [...issuer.votes.values()].sort((a, b) => b.n - a.n)[0].r;
  }
  // El sitio oficial se busca por el emisor, no por el QR: un QR falso no puede cambiar a dónde lleva
  function officialSearch(iss, lucky) {
    const scope = iss.edu ? 'site:.edu' : 'site:.gov';
    const q = (lucky ? '\\' : '') + scope + ' ' + iss.label + (iss.state ? ' ' + iss.state : '') + ' pay ' + (iss.parking ? 'parking ' : '') + 'citation online';
    return 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
  }
  function matchesIssuer(host, iss) {
    if (!iss) return false;
    const h = host.toLowerCase().replace(/^www\./, '');
    if (!(iss.edu ? /\.edu$/ : /(\.gov|\.us)$/).test(h)) return false;
    const words = iss.name.toLowerCase().split(' ').filter(w => w.length >= 4 && !/^(city|town|county|saint)$/.test(w));
    const joined = iss.name.toLowerCase().replace(/[^a-z]/g, ''), initials = iss.name.split(' ').map(w => w[0]).join('').toLowerCase();
    return h.includes(joined) || words.some(w => h.includes(w)) || (initials.length >= 2 && new RegExp('(^|\\.)' + initials + '[a-z]{0,2}\\.').test(h));
  }

  // ============ 2. ¿Es de fiar el sitio? ============
  const REDIRECTORS = /(^|\.)(w69b\.com|bit\.ly|tinyurl\.com|t\.co|goo\.gl|qrco\.de|rebrand\.ly|qr\.io|me-qr\.com|l\.ead\.me|flow\.page|qrfy\.com|scan\.page|is\.gd|cutt\.ly|ow\.ly|page\.link|qr-code-generator\.com|q-r\.to)$/i;
  const BAD_TLD = /\.(zip|top|xyz|click|tk|ml|ga|cf|gq|icu|cam|rest|buzz|cfd|sbs|quest|monster|work|support|loan|win|bid|vip|shop|online|site|live|lol|mom)$/i;

  function remember(host) { try { const m = JSON.parse(localStorage.getItem('multas.sitios') || '{}'); m[host] = (m[host] || 0) + 1; localStorage.setItem('multas.sitios', JSON.stringify(m)); } catch {} }

    if (url.protocol !== 'https:') bad.push('No usa conexión segura (https).');
    if (/^\d+(\.\d+){3}$/.test(host)) bad.push('La dirección es un número (IP), no un nombre de sitio.');
    if (host.includes('xn--')) bad.push('El nombre usa letras disfrazadas para parecerse a otro sitio.');
    if (url.username) bad.push('La dirección esconde el sitio real detrás de una «@».');
    if (BAD_TLD.test(host)) bad.push('Termina en una extensión muy usada en estafas (.' + host.split('.').pop() + ').');
    if (!GOV.test(host) && /(^|[.-])(gov|dmv|irs)([.-]|$)/i.test(name)) bad.push('Usa «gov» o «dmv» en el nombre sin ser un dominio oficial .gov.');
    if (host.split('.').length > 5) bad.push('Tiene demasiados subdominios, algo típico de sitios falsos.');

    if (bad.length) { level = 'bad'; why.push(...bad); }
    else if (GOV.test(host)) { level = 'safe'; why.push('Termina en un dominio reservado al gobierno de EE. UU., que un estafador no puede registrar.', 'Usa conexión segura (https).'); }

    } else {
      why.push('No es un dominio .gov. Muchas ciudades cobran a través de empresas legítimas, pero no puedo confirmarlo.',

    }
    const n = seenBefore(host);
    if (n && level !== 'bad') why.push('Ya abriste este mismo sitio ' + n + (n === 1 ? ' vez' : ' veces') + ' desde este teléfono.');

    return { level, title, why, host };

  // ============ 3. Interfaz ============
  const hint = t => { if ($('hint').textContent !== t) $('hint').textContent = t; };
  function step(id, cls, text) {

    if (text !== undefined) el.querySelector('.val').textContent = text;
  }
  function placeBox(r, animate = true) {

    box.style.width = r.w + 'px'; box.style.height = r.h + 'px';
    if (!animate) { box.offsetWidth; box.style.transition = ''; }
  }
  function defaultBox() {
    const W = innerWidth, top = $('top').getBoundingClientRect().bottom + 14, bottom = sheet.getBoundingClientRect().top - 16;
    const w = Math.min(W * 0.84, 520), h = Math.max(120, bottom - top);
    return { x: (W - w) / 2, y: top, w, h };
  }

  // ============ 4. Cámara ============

  let state = 'idle';                 // idle | scanning | result
  let site = null, siteAt = 0, dataAt = 0;

  async function startCamera() {

      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null;
      const tryGet = c => navigator.mediaDevices.getUserMedia({ audio: false, video: c });
      try { stream = await tryGet({ facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1440 } }); }
      catch (e) {
        try { if (e.name !== 'NotAllowedError') stream = await tryGet(true); } catch {}

                 NotReadableError: 'Otra app está usando la cámara' }[e.name] || 'No se pudo abrir la cámara');

        }

      try { await video.play(); } catch { hint('Pulsa «Activar cámara»'); $('start').hidden = false; return; }

      try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
      torchOn = false; $('torch').setAttribute('aria-pressed', 'false'); $('torch').hidden = false;

  }

  $('torch').onclick = async () => {
    const track = stream && stream.getVideoTracks()[0];

    try {
      await track.applyConstraints({ advanced: [{ torch: !torchOn }] });
      const s = track.getSettings ? track.getSettings().torch : undefined;
      if (s === undefined && !(track.getCapabilities && track.getCapabilities().torch)) throw 0;

  };

  function beginScan() {

    for (const f of Object.values(fields)) { f.votes.clear(); f.value = ''; f.zone = null; f.tries = 0; }
    issuer.votes.clear(); issuer.value = null;
    $('resultView').hidden = true; $('scanView').hidden = false;
    try { sheet.classList.toggle('mini', !!localStorage.getItem('multas.mini')); } catch {}
    step('stSite', 'busy', 'Buscando el código QR…'); step('stNum', '', '—'); step('stTag', '', '—');

  // Dibuja en un lienzo la parte del vídeo que cae en un rectángulo de pantalla
  function grab(rect, maxSide, target = canvas, c2d = ctx) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const vr = video.getBoundingClientRect();
    const scale = Math.max(vr.width / vw, vr.height / vh);
    const offX = (vw * scale - vr.width) / 2, offY = (vh * scale - vr.height) / 2;
    let sx = (rect.x - vr.left + offX) / scale, sy = (rect.y - vr.top + offY) / scale, sw = rect.w / scale, sh = rect.h / scale;
    if (sx < 0) { sw += sx; sx = 0; } if (sy < 0) { sh += sy; sy = 0; }
    sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
    if (sw < 8 || sh < 8) return null;
    const k = Math.min(1, maxSide / Math.max(sw, sh));

    c2d.drawImage(video, sx, sy, sw, sh, 0, 0, target.width, target.height);

  }

  // ============ 5. Bucle rápido: QR + encuadre automático + estabilidad ============

  // Localiza la hoja (lo más claro de la imagen) y mueve el marco hasta abrazarla
  function track(img) {
    const W = img.width, H = img.height, d = img.data;
    const top = $('top').getBoundingClientRect().bottom / innerHeight * H;
    const bottom = sheet.getBoundingClientRect().top / innerHeight * H;
    const cell = Math.max(6, Math.round(W / 44)), cols = Math.floor(W / cell), rows = Math.floor((bottom - top) / cell);
    if (rows < 4) return;
    const g = new Float32Array(cols * rows);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = (((top + r * cell + cell / 2) | 0) * W + ((c * cell + cell / 2) | 0)) * 4;
      g[r * cols + c] = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];

    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (g[r * cols + c] > thr) { colSum[c]++; rowSum[r]++; }

      let best = [0, -1], s = -1, last = -1;
      for (let i = 0; i <= n; i++) {

      }

    const bw = c1 - c0 + 1, bh = r1 - r0 + 1;

      paper = paper ? { x: paper.x + (target.x - paper.x) * .5, y: paper.y + (target.y - paper.y) * .5, w: paper.w + (target.w - paper.w) * .5, h: paper.h + (target.h - paper.h) * .5 } : target;

  // ============ 6. Lectura del texto ============

  // En gris y con más contraste: el lector acierta más

    for (let i = 0; i < d.length; i += 4) { const v = Math.max(0, Math.min(255, (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2] - lo) * k)); d[i] = d[i + 1] = d[i + 2] = v; }

  // ============ 7. Progreso y final ============
  function foundSite(u) {

  }

    step('stNum', sure('num') ? 'ok' : (site || n.value ? 'busy' : ''), n.value || (site ? 'Leyendo…' : '—'));
    step('stTag', sure('tag') ? 'ok' : (sure('num') || t.value ? 'busy' : ''), t.value || (sure('num') ? 'Leyendo…' : '—'));
    if (site && !sure('num')) hint('Sitio encontrado. Leyendo Citation No.…');

    else if (!site && sure('num')) hint('Ahora enfoca el código QR');
  }
  function check() {

    if (site && now - siteAt > 12000) return finish();         // sitio sí, datos no: no esperar más
    if (!site && both && issuer.value && now - dataAt > 3000) return finish(); // emisor y datos: el QR ya no hace falta
    if (!site && both && now - dataAt > 8000) return finish(); // datos sí, QR no
  }

  function fillWhy(list) {
    const ul = $('vdWhy'); ul.textContent = '';

  }

    $('fNum').value = fields.num.value; $('fTag').value = fields.tag.value;
    $('foot').textContent = FOOT;
    const missing = !fields.num.value || !fields.tag.value;
    $('rTitle').textContent = missing ? 'Revisa los datos' : 'Multa leída';
    hint(missing ? 'No pude leer todo: complétalo a mano' : 'Listo');
    const go = $('go'), off = $('official'), others = $('others'), v = $('verdict'), iss = issuer.value;
    go.dataset.confirm = '';

    if (iss) { $('issuer').textContent = 'Emitida por '; const b = document.createElement('b'); b.textContent = iss.label + (iss.state ? ', ' + iss.state : ''); $('issuer').append(b); }
    off.hidden = others.hidden = !iss;

        fillWhy(['No encontré código QR. El botón busca el sitio de pago de ' + iss.label + ' solo entre dominios oficiales y abre el primero.',
                 'Si la multa fuera falsa, su número no aparecerá en el sitio oficial.']);
      } else {
        v.className = 'warn';
        $('vdTitle').textContent = 'No identifiqué al emisor ni encontré QR'; $('vdHost').textContent = '';
        fillWhy(['Busca el sitio por el nombre de la ciudad, condado o corte que aparece arriba en la multa.', 'Entra solo en sitios .gov o en el que nombra la propia multa.']);
        off.hidden = false; off.textContent = 'Buscar sitio oficial';

    } else if (iss && match) {

      fillWhy(['El enlace del QR es un dominio oficial de ' + iss.label + '.', ...j.why.filter(w => /Ya abriste/.test(w))]);
      go.textContent = 'Abrir sitio de pago oficial'; go.className = 'btn primary'; go.style.order = '-1';
      off.textContent = 'Buscar el sitio de ' + iss.label + ' por mi cuenta'; off.className = 'btn';

    } else if (iss) {
      v.className = 'warn'; $('vdTitle').textContent = 'El QR no lleva al sitio oficial de ' + iss.label;
      fillWhy([REDIRECTORS.test(site.hostname) ? 'El QR pasa por un servicio intermedio y no puedo comprobar a dónde termina.' : 'El dominio del QR no pertenece a ' + iss.label + '.',
               'Usa el botón azul: busca el sitio de pago solo entre dominios oficiales. Si la multa fuera falsa, su número no aparecerá allí.']);
      go.textContent = 'Abrir enlace del QR';
    } else {
      v.className = j.level; $('vdTitle').textContent = j.title; fillWhy(j.why);

  // Un sitio que no existe casi siempre es un QR falso o dañado
  function checkAlive(target) {
    const go = $('go'), v = $('verdict');
    exists(target).then(ok => {
      if (ok || state !== 'result' || site !== target) return;
      v.className = 'bad'; $('vdTitle').textContent = 'El enlace del QR no responde';
      fillWhy(['La dirección del QR no existe o está caída. No introduzcas datos de pago en ella.' + (issuer.value ? ' Usa el sitio oficial del emisor.' : '')]);
      go.textContent = 'Abrir enlace del QR de todos modos'; go.className = 'btn danger'; go.dataset.confirm = '1';
    });

  async function exists(url) {

  async function copy(input, btn) {
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    try { await navigator.clipboard.writeText(v); btn.textContent = 'Copiado'; btn.classList.add('done'); }
    catch { input.select(); btn.textContent = 'Selecciona'; }
    setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('done'); }, 2200);
  }
  $('cNum').onclick = () => copy($('fNum'), $('cNum'));
  $('cTag').onclick = () => copy($('fTag'), $('cTag'));
  function copyOnOpen() {
    const n = $('fNum').value.trim();
    if (!n) return;
    navigator.clipboard?.writeText(n).catch(() => {});
    $('foot').textContent = 'Citation No. copiado: pégalo en el sitio. Luego vuelve aquí y pulsa «Copiar» en Vehicle Tag.';
  }
  $('go').addEventListener('click', e => {
    const go = $('go');
    if (go.dataset.confirm === '1') {           // sitio sospechoso: pide un segundo toque
      e.preventDefault(); go.dataset.confirm = '2'; go.textContent = 'Toca otra vez para abrir';
      return;
    }
    copyOnOpen();
    if (site) remember(site.hostname);
  });
  $('official').addEventListener('click', copyOnOpen);

  // Panel inferior: se minimiza deslizando hacia abajo o tocando la barrita, y se amplía al revés
  function setMini(on) {
    if (state === 'result') on = false;
    sheet.classList.toggle('mini', on);
    $('grab').setAttribute('aria-expanded', String(!on));
    try { localStorage.setItem('multas.mini', on ? '1' : ''); } catch {}
    if (state === 'scanning' && !(lockHits >= 2 && paper)) requestAnimationFrame(() => placeBox(defaultBox()));
  }
  $('grab').onclick = () => setMini(!sheet.classList.contains('mini'));
  let dragY = null;
  sheet.addEventListener('touchstart', e => { dragY = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend', e => {
    if (dragY === null || state !== 'scanning') { dragY = null; return; }
    const dy = e.changedTouches[0].clientY - dragY; dragY = null;
    if (dy > 28) setMini(true); else if (dy < -28) setMini(false);
  }, { passive: true });
  try { if (localStorage.getItem('multas.mini')) sheet.classList.add('mini'); } catch {}

  addEventListener('resize', () => { if (state === 'scanning' && !paper) placeBox(defaultBox()); });
  window.__test = { judge, parse, fields, parseIssuer, officialSearch, matchesIssuer, issuer };
  placeBox(defaultBox(), false);
  startCamera();
});
</script>
